<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leituras ESP32 - Painel de Monitoramento</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
     <!-- Biblioteca Leaflet para OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* Estilização Geral e Cores Globais */
        :root {
            --bg-body: #f4f6f9;
            --bg-card: #ffffff;
            --primary: #2c3e50;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --border-color: #e9ecef;
            --accent: #3498db;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        /* Container do Painel (oculto até validar o login) */
        .dashboard-container {
            display: none;
            width: 100%;
            max-width: 1000px;
            background-color: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin-top: 20px;
        }

        /* Cabeçalho */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        h2 {
            color: var(--primary);
            margin: 0;
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 24px;
            background-color: var(--accent);
            border-radius: 4px;
        }

        .btn-logout {
            padding: 8px 16px;
            background-color: var(--danger);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-logout:hover {
            opacity: 0.9;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Área de Filtro */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-container input {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            transition: border-color 0.2s;
        }

        .filter-container input:focus {
            border-color: var(--accent);
        }

        .filter-container button {
            padding: 10px 18px;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .filter-container button:hover {
            opacity: 0.9;
        }

        .filter-container button.btn-clear {
            background-color: #95a5a6;
        }

        /* Wrapper da Tabela para Rolagem Responsiva */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Estilização Avançada da Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: var(--bg-card);
        }

        th {
            background-color: #fafbfc;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 16px 20px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: #4a5568;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

         /* Área do Mapa OpenStreetMap */
        #map-container {
            display: none;
            margin-top: 25px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        #map {
            width: 100%;
            height: 420px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container" id="painelContainer">
        <div class="header-top">
            <h2>Últimas Leituras do ESP32</h2>
            <button id="btnLogout" class="btn-logout">Sair</button>
        </div>
        <p>Coordenadas e timestamp sincronizados em tempo real com o banco de dados.</p>

        <!-- Filtro por ID -->
        <div class="filter-container">
            <input type="text" id="filtroIdInput" placeholder="Filtrar por ID.Animal...">
            <button id="btnFiltrar">Filtrar</button>
            <button id="btnLimpar" class="btn-clear">Limpar</button>
             <button id="btnMapa" class="btn-map">Plotar Mapa</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Data / Hora</th>
                        <th>ID.Animal</th>
                        <th>Latitude</th>
                        <th>Longitude</th>
                        <th>Peso (kg)</th>
                    </tr>
                </thead>
                <tbody id="leituras">
                    <tr>
                        <td colspan="5" class="loading-text">Conectando ao Firebase e carregando histórico...</td>
                    </tr>
                </tbody>
            </table>
        </div>

         <!-- Contêiner onde o OpenStreetMap será plotado -->
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
             apiKey: "AIzaSyBH8Kl3AjDIOufD4hRqKOu9aNAmRGWAcZE",
  authDomain: "horaesp32-404f2.firebaseapp.com",
  databaseURL: "https://horaesp32-404f2-default-rtdb.firebaseio.com",
  projectId: "horaesp32-404f2",
  storageBucket: "horaesp32-404f2.firebasestorage.app",
  messagingSenderId: "156002209787",
  appId: "1:156002209787:web:478269ae5c774ed8d6055e",
  measurementId: "G-M34Z73GZTH"
        };
        firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();
        const painelContainer = document.getElementById("painelContainer");
        const btnLogout = document.getElementById("btnLogout");

        // Verifica se o usuário está autenticado antes de mostrar o painel
        auth.onAuthStateChanged((user) => {
            if (user) {
                painelContainer.style.display = "block";
                iniciarMonitoramento();
            } else {
                // Se não estiver logado, volta para a tela de login
                window.location.href = "index.html";
            }
        });

        // Botão de Logout
        btnLogout.addEventListener("click", () => {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        });

        function iniciarMonitoramento() {
            const tbody = document.getElementById("leituras");
            const filtroIdInput = document.getElementById("filtroIdInput");
            const btnFiltrar = document.getElementById("btnFiltrar");
            const btnLimpar = document.getElementById("btnLimpar");

            function aplicarFiltro() {
                const termo = filtroIdInput.value.trim().toLowerCase();
                const linhas = tbody.querySelectorAll("tr");

                linhas.forEach((linha) => {
                    const colunaId = linha.children[1];
                    if (colunaId) {
                        const textoId = colunaId.textContent.trim().toLowerCase();
                        if (termo === "" || textoId.includes(termo)) {
                            linha.style.display = "";
                        } else {
                            linha.style.display = "none";
                        }
                    }
                });
                
            }

            btnFiltrar.addEventListener("click", aplicarFiltro);
            btnLimpar.addEventListener("click", () => {
                filtroIdInput.value = "";
                aplicarFiltro();
            });

            db.ref("leituras").limitToLast(10).on("value", (snapshot) => {
                tbody.innerHTML = "";

                if (!snapshot.exists()) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="loading-text">Nenhum registro encontrado.</td>
                        </tr>
                    `;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const dado = childSnapshot.val();
                    const partes = typeof dado === "string" ? dado.split("|").map(item => item.trim()) : [];

                    const hora = partes[0] || '-';
                    const Id = partes[1] || '-';
                    const latitude = partes[2] || '-';
                    const longitude = partes[3] || '-';
                    const peso = partes[4] || '-';

                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${hora}</td>
                        <td>${Id}</td>
                        <td>${latitude}</td>
                        <td>${longitude}</td>
                        <td>${peso}</td>
                    `;

                    tbody.prepend(tr);
                });

                aplicarFiltro();
            });
            // =========================================================================
        // LÓGICA DO MAPA (OPENSTREETMAP VIA LEAFLET)
        // =========================================================================
        const btnMapa = document.getElementById("btnMapa");
        const mapContainer = document.getElementById("map-container");
        let mapaOSM = null;
        let camadaTrajeto = null;

        function plotarMapa() {
            const linhas = Array.from(tbody.querySelectorAll("tr"));
            const pontos = [];

            // Coleta apenas as linhas visíveis (respeitando o ID filtrado)
            linhas.forEach((linha) => {
                if (linha.style.display !== "none" && linha.children.length === 5) {
                    const dataHoraTxt = linha.children[0].textContent.trim();
                    const idTxt = linha.children[1].textContent.trim();
                    const latNum = parseFloat(linha.children[2].textContent.trim().replace(",", "."));
                    const lngNum = parseFloat(linha.children[3].textContent.trim().replace(",", "."));
                    const pesoTxt = linha.children[4].textContent.trim();

                    if (!isNaN(latNum) && !isNaN(lngNum)) {
                        pontos.push({
                            lat: latNum,
                            lng: lngNum,
                            dataHora: dataHoraTxt,
                            id: idTxt,
                            peso: pesoTxt
                        });
                    }
                }
            });

            if (pontos.length === 0) {
                alert("Nenhuma coordenada válida encontrada para os registros filtrados.");
                return;
            }

            // Inverte a ordem para que a linha siga do registro mais antigo para o mais recente
            pontos.reverse();

            // Exibe o contêiner do mapa
            mapContainer.style.display = "block";

            // Inicializa o OpenStreetMap apenas no primeiro clique
            if (!mapaOSM) {
                mapaOSM = L.map("map");
                L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(mapaOSM);
                camadaTrajeto = L.layerGroup().addTo(mapaOSM);
            }

            // Garante que o mapa ajuste o tamanho corretamente após sair de display: none
            mapaOSM.invalidateSize();

            // Limpa rotas anteriores antes de desenhar a nova
            camadaTrajeto.clearLayers();

            const coordenadas = pontos.map(p => [p.lat, p.lng]);

            // Desenha a linha conectando as coordenadas na ordem da movimentação
            const linhaTrajeto = L.polyline(coordenadas, {
                color: "#3498db",
                weight: 4,
                opacity: 0.85
            }).addTo(camadaTrajeto);

            // Adiciona marcadores em cada coordenada com popup informativo
            pontos.forEach((ponto, index) => {
                const marcador = L.circleMarker([ponto.lat, ponto.lng], {
                    radius: index === 0 || index === pontos.length - 1 ? 8 : 5,
                    color: index === pontos.length - 1 ? "#e74c3c" : "#2c3e50",
                    fillColor: index === 0 ? "#27ae60" : (index === pontos.length - 1 ? "#e74c3c" : "#3498db"),
                    fillOpacity: 0.9,
                    weight: 2
                }).addTo(camadaTrajeto);

                const etiqueta = index === 0 ? " (Início)" : (index === pontos.length - 1 ? " (Última posição)" : "");
                marcador.bindPopup(`
                    <strong>ID: ${ponto.id}${etiqueta}</strong><br>
                    Data/Hora: ${ponto.dataHora}<br>
                    Peso: ${ponto.peso} kg<br>
                    Coord: ${ponto.lat}, ${ponto.lng}
                `);
            });

            // Ajusta o zoom automaticamente para enquadrar toda a rota
            if (coordenadas.length > 1) {
                mapaOSM.fitBounds(linhaTrajeto.getBounds(), { padding: [30, 30] });
            } else {
                mapaOSM.setView(coordenadas[0], 16);
            }
        }

        btnMapa.addEventListener("click", plotarMapa);
        }
    </script>

</body>
</html>
